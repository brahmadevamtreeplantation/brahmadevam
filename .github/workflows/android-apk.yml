name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "index.html"
      - "styles.css"
      - "chess.js"
      - "game.js"
      - "chess-king-icon.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Test chess rules engine
        run: node --test tests/chess.test.js

      - name: Bundle the website into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css chess.js game.js chess-king-icon.png android/app/src/main/assets/www/
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp chess-king-icon.png android/app/src/main/res/drawable-nodpi/chess_king_icon.png

      - name: Build installable debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Chess-King.apk
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Chess-King.apk \
            --target "$GITHUB_SHA" \
            --title "CHESS MASTER Android ${tag}" \
            --notes "Installable Android debug build. The game runs offline after installation." \
            --latest
